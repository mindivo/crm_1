<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect width="256" height="130" rx="52" fill="url(#shine)"/>
  <!-- Building silhouette (real estate) -->
  <!-- Main building -->
  <rect x="70" y="110" width="116" height="108" rx="4" fill="white" opacity="0.95"/>
  <!-- Roof triangle -->
  <polygon points="58,114 128,58 198,114" fill="white" opacity="0.95"/>
  <!-- Door -->
  <rect x="108" y="164" width="40" height="54" rx="4" fill="#0f766e"/>
  <!-- Windows -->
  <rect x="82" y="128" width="26" height="24" rx="3" fill="#0f766e" opacity="0.7"/>
  <rect x="148" y="128" width="26" height="24" rx="3" fill="#0f766e" opacity="0.7"/>
  <!-- Chimney accent dot -->
  <circle cx="196" cy="80" r="10" fill="white" opacity="0.3"/>
</svg>
